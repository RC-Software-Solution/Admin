<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel: UI mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root {
  --tea: #123524;
  --tea-2: #1c4a33;
  --mint: #8fd0a8;
  --leaf: #16803c;
  --leaf-hover: #116332;
  --leaf-tint: #e2f0e6;
  --leaf-line: #b9d9c3;
  --paper: #f3f5f0;
  --white: #ffffff;
  --ink: #18241d;
  --mist: #5c6b61;
  --line: #dde3db;
  --line-strong: #c3ccc1;
  --turmeric: #e0a100;
  --turmeric-tint: #fbefc9;
  --turmeric-ink: #6b4b00;
  --brick: #b3362a;
  --brick-tint: #f8dfdb;
  --brick-ink: #8a261c;
  --sky-tint: #e6edf3;
  --font-head: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, "Segoe UI", "Nirmala UI", sans-serif;
  --r-ctl: 6px;
  --r-float: 10px;
  --focus: 0 0 0 3px rgba(22, 128, 60, 0.28);
  --shadow-float: 0 12px 32px rgba(18, 53, 36, 0.16), 0 2px 6px rgba(18, 53, 36, 0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 14px/1.45 var(--font-body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--leaf); text-decoration: none; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ===== Mockup picker (hidden with ?bare) ===== */
#picker { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; padding: 8px 14px; background: #0b2016; color: #b7cdbd; font-size: 12px; position: sticky; top: 0; z-index: 5000; }
#picker b { color: #fff; margin-right: 6px; font-family: var(--font-head); font-size: 13px; }
#picker a { color: #b7cdbd; padding: 3px 8px; border-radius: 4px; }
#picker a:hover { background: rgba(255,255,255,.1); }
#picker a.on { background: var(--leaf); color: #fff; }
body.bare #picker { display: none; }

/* ===== Shell ===== */
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--tea) 244px, var(--paper) 244px); }
body:not(.bare) .app { min-height: calc(100vh - 44px); }
.rail { background: var(--tea); color: #c9dccf; padding: 20px 12px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
body:not(.bare) .rail { top: 44px; height: calc(100vh - 44px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px; font: 700 21px/1 var(--font-head); letter-spacing: -0.01em; color: #fff; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--mint), var(--leaf)); display: block; position: relative; }
.brand i::after { content: ""; position: absolute; inset: 6px; border-radius: 2px; background: var(--tea); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup > span { padding: 0 10px 6px; font-size: 12px; font-weight: 500; color: #86a893; }
.navitem { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-ctl); color: #c9dccf; font-size: 14px; position: relative; }
.navitem:hover { background: rgba(255,255,255,.06); color: #fff; }
.navitem.on { background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
.navitem.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--mint); }

.stage { min-width: 0; padding: 0 32px 56px; }
.topbar { display: flex; align-items: center; gap: 14px; height: 72px; }
.iconbtn.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 440px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mist); }
.search input { width: 100%; height: 40px; padding: 0 12px 0 38px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--white); }
.search input::placeholder { color: #7b897f; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.iconbtn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--white); cursor: pointer; }
.iconbtn .n { position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--brick); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.me { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px 0 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); font-weight: 500; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--tea); color: #fff; display: grid; place-items: center; font: 600 13px var(--font-head); flex: none; }
.avatar.soft { background: #dfe9e2; color: var(--tea); }
.avatar.lg { width: 56px; height: 56px; font-size: 20px; }

.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; padding: 8px 0 22px; }
.pagehead h1 { font: 700 32px/1.1 var(--font-head); letter-spacing: -0.02em; }
.pagehead p { margin-top: 6px; color: var(--mist); font-size: 14px; }
.pagehead .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== Buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border: 1px solid transparent; border-radius: var(--r-ctl); font-weight: 500; cursor: pointer; white-space: nowrap; background: none; }
.btn.sm { height: 31px; padding: 0 12px; font-size: 13px; }
.btn.primary { background: var(--leaf); color: #fff; }
.btn.primary:hover { background: var(--leaf-hover); }
.btn.secondary { background: var(--white); border-color: var(--line-strong); color: var(--ink); }
.btn.secondary:hover { background: #f6f8f4; }
.btn.ghost { color: var(--ink); }
.btn.ghost:hover { background: rgba(18,53,36,.07); }
.btn.danger { background: var(--brick); color: #fff; }
.btn.danger-ghost { color: var(--brick-ink); }
.btn.danger-ghost:hover { background: var(--brick-tint); }
.btn:disabled, .btn.disabled { opacity: .45; cursor: not-allowed; }
.btn.icon { width: 31px; padding: 0; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Controls ===== */
.ctl { height: 38px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--white); min-width: 0; }
textarea.ctl { height: auto; padding: 10px 12px; line-height: 1.45; resize: vertical; }
.ctl:focus-visible, .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: none; border-color: var(--leaf); box-shadow: var(--focus); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select, .field textarea { height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--white); width: 100%; }
.field textarea { height: auto; padding: 10px 12px; }
.field .hint { font-size: 12.5px; color: var(--mist); }
.field.bad input { border-color: var(--brick); }
.field .err { font-size: 12.5px; color: var(--brick-ink); font-weight: 500; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filters label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mist); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--white); cursor: pointer; font-weight: 500; font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; }
.chip .c { font-size: 12px; color: var(--mist); font-weight: 600; }
.chip.on { background: var(--tea); border-color: var(--tea); color: #fff; }
.chip.on .c { color: #b3cfbc; }
.chip.attn.on { background: var(--turmeric-tint); border-color: var(--turmeric); color: var(--turmeric-ink); }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { padding: 10px 0; border: 0; background: none; cursor: pointer; font-weight: 500; color: var(--mist); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--leaf); font-weight: 600; }
.seg { display: inline-flex; max-width: 100%; overflow-x: auto; padding: 3px; background: #e6ebe3; border-radius: 8px; gap: 2px; }
.seg button { white-space: nowrap; height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: none; cursor: pointer; font-weight: 500; color: var(--mist); }
.seg button.on { background: var(--white); color: var(--ink); box-shadow: 0 1px 2px rgba(18,53,36,.15); }
.switch { width: 38px; height: 22px; border-radius: 999px; background: var(--line-strong); position: relative; flex: none; border: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch.on { background: var(--leaf); }
.switch.on::after { transform: translateX(16px); }
input[type=checkbox].cb { width: 18px; height: 18px; accent-color: var(--leaf); }

/* ===== Badges, markers ===== */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.neutral { background: #e8ece6; color: #3a4a40; }
.badge.leaf { background: var(--leaf-tint); color: var(--leaf-hover); }
.badge.turmeric { background: var(--turmeric-tint); color: var(--turmeric-ink); }
.badge.brick { background: var(--brick-tint); color: var(--brick-ink); }
.badge.tea { background: var(--tea); color: #fff; }
.badge.outline { border: 1px solid var(--line-strong); color: var(--mist); background: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.leaf { background: var(--leaf); } .dot.turmeric { background: var(--turmeric); } .dot.brick { background: var(--brick); } .dot.mist { background: var(--line-strong); } .dot.ring { background: none; border: 2px solid var(--line-strong); }
.mark { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.mark.unpaid { font-weight: 600; }
.muted { color: var(--mist); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.strong { font-weight: 600; }

/* Order lifecycle track */
.track { display: flex; flex-direction: column; gap: 5px; }
.track .bars { display: flex; gap: 3px; }
.track .bars i { width: 26px; height: 6px; border-radius: 3px; background: #dfe5dd; }
.track .bars i.wait { background: var(--turmeric); }
.track .bars i.on { background: var(--leaf); }
.track .bars i.done { background: var(--tea); }
.track .bars i.x { background: repeating-linear-gradient(135deg, #e7c3be 0 3px, #f3dcd8 3px 6px); }
.track .bars i.bad { background: var(--brick); }
.track .lbl { font-size: 12.5px; font-weight: 600; }
.track.s-pending .lbl { color: var(--turmeric-ink); }
.track.s-cancelled .lbl, .track.s-delivery_failed .lbl { color: var(--brick-ink); }
.track.lg .bars i { width: 54px; height: 9px; }

/* ===== Lists (ruled rows on paper) ===== */
.list { border-top: 1px solid var(--line-strong); }
.lhead, .lrow { display: grid; grid-template-columns: var(--cols); gap: 16px; align-items: center; padding: 0 12px; }
.lhead { height: 40px; font-size: 12.5px; font-weight: 600; color: var(--mist); border-bottom: 1px solid var(--line); }
.lrow { min-height: 66px; padding-top: 11px; padding-bottom: 11px; border-bottom: 1px solid var(--line); position: relative; }
.lrow:hover { background: var(--white); }
.lrow.attn { box-shadow: inset 4px 0 0 var(--turmeric); }
.lrow.bad { box-shadow: inset 4px 0 0 var(--brick); }
.lrow .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lrow .who > div > b, .lrow .who > b { display: block; font-weight: 600; font-size: 14.5px; }
.lrow .who > div > span { display: block; color: var(--mist); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .num, .lhead .num { text-align: right; }
.lrow .num { font-weight: 600; }
.lrow .acts, .lhead .acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.lfoot { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; color: var(--mist); font-size: 13px; }
.thumb { width: 44px; height: 44px; border-radius: 8px; background: var(--leaf-tint); display: grid; place-items: center; font: 700 15px var(--font-head); color: var(--tea); flex: none; }
.thumb.t2 { background: var(--turmeric-tint); color: var(--turmeric-ink); }
.thumb.t3 { background: #e6edf3; color: #2c4c68; }
.thumb.t4 { background: var(--brick-tint); color: var(--brick-ink); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #e8ece6; color: #3a4a40; font-size: 12px; margin: 2px 4px 2px 0; }

/* panels used sparingly: forms, floating things */
.panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-float); padding: 22px; }
.panel h2 { font: 700 18px/1.2 var(--font-head); letter-spacing: -0.01em; margin-bottom: 4px; }
.sectionhead { font: 700 19px/1.2 var(--font-head); letter-spacing: -0.01em; margin: 30px 0 12px; }
.sectionhead.first { margin-top: 0; }
.stack { display: grid; gap: 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.two.dash2 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.setpanel { max-width: 760px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }

/* ===== Dashboard pieces ===== */
.attention { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--white); border: 1px solid var(--line); border-radius: var(--r-float); margin-bottom: 26px; }
.attention > div { padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; }
.attention > div + div { border-left: 1px solid var(--line); }
.attention .big { font: 700 46px/1 var(--font-head); letter-spacing: -0.03em; }
.attention .big.hot { box-shadow: inset 0 -10px 0 var(--turmeric-tint); display: inline-block; align-self: flex-start; }
.attention .big.bad { box-shadow: inset 0 -10px 0 var(--brick-tint); display: inline-block; align-self: flex-start; }
.attention p { color: var(--mist); }
.attention .btn { align-self: flex-start; margin-top: 10px; }
.kpis { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 8px; }
.kpi { padding: 4px 0; }
.kpi .lab { color: var(--mist); font-size: 13px; font-weight: 500; }
.kpi .val { font: 700 38px/1.1 var(--font-head); letter-spacing: -0.025em; margin: 4px 0 2px; }
.kpi .delta { font-weight: 600; font-size: 13px; }
.delta.up { color: var(--leaf-hover); } .delta.down { color: var(--brick-ink); }
.chartbars { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 8px; }
.chartbars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; }
.chartbars .col i { display: block; border-radius: 3px 3px 0 0; }
.chartbars.spark .col i { width: 100%; max-width: 40px; align-self: center; }
.chartbars .col span { margin-top: 6px; font-size: 12px; color: var(--mist); text-align: center; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--mist); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.meter { height: 6px; border-radius: 3px; background: #e3e8e1; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--leaf); }

/* ===== Floating: modal, drawer, toast, bar ===== */
.scrim { position: fixed; inset: 0; background: rgba(18,53,36,.45); z-index: 3000; display: grid; place-items: center; padding: 16px; }
body:not(.bare) .scrim { top: 44px; }
.dialog { width: min(480px, 100%); background: var(--white); border-radius: var(--r-float); box-shadow: var(--shadow-float); padding: 26px; display: grid; gap: 16px; max-height: 92vh; overflow: auto; }
.dialog h2 { font: 700 21px/1.2 var(--font-head); letter-spacing: -0.015em; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.dialog p { color: var(--mist); }
.drawer-wrap { position: fixed; inset: 0; z-index: 3000; background: rgba(18,53,36,.45); display: flex; justify-content: flex-end; }
body:not(.bare) .drawer-wrap { top: 44px; }
.drawer { width: min(520px, 100%); background: var(--white); height: 100%; overflow: auto; box-shadow: var(--shadow-float); padding: 26px; display: grid; gap: 22px; align-content: start; }
.timeline { display: grid; gap: 0; }
.timeline > div { display: grid; grid-template-columns: 14px 1fr; gap: 14px; padding-bottom: 18px; position: relative; }
.timeline > div::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
.timeline > div:last-child::before { display: none; }
.timeline .pt { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--leaf); background: var(--white); margin-top: 3px; }
.timeline .pt.bad { border-color: var(--brick); }
.timeline .pt.warn { border-color: var(--turmeric); }
.toast { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; border-radius: var(--r-float); background: var(--tea); color: #fff; box-shadow: var(--shadow-float); font-weight: 500; width: fit-content; max-width: 100%; }
.toast.err { background: var(--brick); }
.toast button { background: none; border: 0; color: inherit; opacity: .8; cursor: pointer; font-size: 18px; line-height: 1; }
.selbar { position: fixed; left: calc(50% + 122px); transform: translateX(-50%); bottom: 22px; z-index: 2500; display: flex; align-items: center; gap: 16px; padding: 10px 10px 10px 20px; background: var(--tea); color: #fff; border-radius: 999px; box-shadow: var(--shadow-float); }
.selbar .btn { border-radius: 999px; }
.alert { padding: 12px 16px; border-radius: var(--r-ctl); border: 1px solid; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.alert.err { background: var(--brick-tint); border-color: #e8b5ae; color: var(--brick-ink); }
.alert.warn { background: var(--turmeric-tint); border-color: #ecd185; color: var(--turmeric-ink); }
.alert.ok { background: var(--leaf-tint); border-color: var(--leaf-line); color: var(--leaf-hover); }
.empty { text-align: center; padding: 56px 16px; display: grid; gap: 8px; justify-items: center; color: var(--mist); }
.empty h3 { font: 700 19px var(--font-head); color: var(--ink); }
.skel { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #e6ebe3, #f1f4ee, #e6ebe3); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }

/* ===== Login ===== */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.login .art { background: var(--tea); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login .art h2 { font: 700 46px/1.05 var(--font-head); letter-spacing: -0.03em; max-width: 12ch; }
.login .art p { color: #a9c4b3; max-width: 34ch; margin-top: 16px; font-size: 16px; }
.login .form { display: grid; place-items: center; padding: 32px; }
.login .box { width: min(380px, 100%); display: grid; gap: 18px; }
.login .box h1 { font: 700 30px/1.1 var(--font-head); letter-spacing: -0.02em; }
body.bare .login, .login { }

/* ===== Mockup-only helpers ===== */
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.sw > div { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--white); }
.sw > div > i { display: block; height: 64px; }
.sw > div > span { display: block; padding: 8px 10px; font-size: 12.5px; }
.cs { margin-bottom: 44px; }
.cs > h2 { font: 700 24px var(--font-head); letter-spacing: -0.02em; margin-bottom: 4px; }
.cs > .d { color: var(--mist); margin-bottom: 18px; }
.demo { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-float); padding: 22px; display: grid; gap: 18px; }
.demo.paper { background: var(--paper); }
.row-flex { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tscale > div { display: flex; align-items: baseline; gap: 18px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tscale small { width: 160px; color: var(--mist); font-size: 12.5px; flex: none; }
.phone { width: 390px; border: 1px solid var(--line-strong); border-radius: 22px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow-float); }

  <section class="cs"><h2>Badges and markers</h2><p class="d">Badges label what something is. Markers show a state with a dot.</p>
    <div class="demo"><div class="row-flex"><span class="badge tea">Super admin</span><span class="badge neutral">Admin</span><span class="badge leaf">Open now</span><span class="badge turmeric">Pending approval</span><span class="badge brick">Blocked</span><span class="badge outline">Upcoming</span></div>
    <div class="row-flex" style="gap:22px">${pay("paid")}${pay("unpaid")}${pay("pending")}${pay("ignored")}<span class="mark"><i class="dot leaf"></i>Active</span><span class="mark"><i class="dot mist"></i>Suspended</span><span class="mark"><i class="dot leaf"></i>Veg</span><span class="mark"><i class="dot brick"></i>Non-veg</span></div></div></section>

  <section class="cs"><h2>Form fields</h2><p class="d">Labels sit above fields, never replaced by placeholders. Errors say how to fix it.</p>
    <div class="demo"><div class="two" style="gap:18px"><div class="field"><label>Full name</label><input value="Nadeesha Perera"><span class="hint">As shown in the audit log</span></div>
    <div class="field bad"><label>Temporary password</label><input type="password" value="abc"><span class="err">Use at least 8 characters.</span></div>
    <div class="field"><label>Role</label><select><option>Admin</option></select></div><div class="field"><label>Message</label><textarea rows="2"></textarea></div></div>
    <div class="row-flex" style="gap:24px"><label class="row-flex" style="gap:8px"><input class="cb" type="checkbox" checked> Select all on this page</label><label class="row-flex" style="gap:8px"><button class="switch on" role="switch" aria-checked="true"></button> Available to customers</label><label class="row-flex" style="gap:8px"><button class="switch" role="switch" aria-checked="false"></button> Off</label></div></div></section>

  <section class="cs"><h2>List rows</h2><p class="d">Rows are ruled lines on the paper, not cards. A coloured edge marks rows that need a human: turmeric for attention, brick for failure.</p>
    <div class="demo paper" style="padding:0 0 8px"><div class="list" style="border-top:0">${ORDERS.slice(0, 5).filter((_, i) => i !== 1 && i !== 2).map((o) => { const [n, id, area, items, total, st, p, t, act] = o; return `<div class="lrow ${st === "delivery_failed" ? "bad" : p === "unpaid" || st === "pending" ? "attn" : ""}" style="--cols:minmax(0,1.5fr) 110px 150px 100px 240px"><div class="m-title"><b style="font-weight:600;font-size:14.5px">${n}</b><div class="muted small">${id} · ${area} · ${items} items · ${t}</div></div><span class="num m-amt">${money(total)}</span><div class="m-hide">${track(st)}</div><div class="m-hide">${pay(p)}</div><div class="acts">${act ? btn(act, /paid/.test(act) ? "primary" : "secondary", "sm") : ""}${more}</div></div>`; }).join("")}</div></div></section>

  <section class="cs"><h2>Dialogs, sheets and toasts</h2><p class="d">Dialogs are centred on desktop and slide up as bottom sheets on phones. Toasts repeat the action's name.</p>
    <div class="demo" style="background:#d4dbd1"><div class="two" style="align-items:start"><div class="dialog" style="width:100%;box-shadow:var(--shadow-float)"><h2>Send payment reminders</h2><p>Send a reminder to 3 customers? Each gets one push with their unpaid total. Customers without the app won't receive it.</p><div class="foot">${btn("Cancel")}${btn("Send reminders", "primary")}</div></div>
    <div class="phone" style="align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;min-height:300px;background:rgba(18,53,36,.45)"><div class="sheet"><h2 style="font:700 20px var(--font-head)">Delete Nugegoda?</h2><p class="muted">This area has no customers, so it can be removed.</p>${btn("Delete area", "danger", "")}${btn("Cancel", "secondary", "")}</div></div></div>
    <div class="row-flex"><div class="toast">${ic("check")} Marked paid <button aria-label="Dismiss">×</button></div><div class="toast">Reminder sent to 3 customers <button aria-label="Dismiss">×</button></div><div class="toast err">Couldn't mark paid: Request failed (500) <button aria-label="Dismiss">×</button></div></div></div></section>

  <section class="cs"><h2>Alerts, empty and loading states</h2><p class="d">Say what happened and what to do next. An empty list invites an action.</p>
    <div class="demo"><div class="alert err" style="margin:0">${ic("info")}<span><b>Couldn't load orders.</b> Request failed (500). Showing the last loaded orders.</span></div><div class="alert warn" style="margin:0"><span>Pick both dates to filter by date.</span></div>
    <div class="two"><div class="empty" style="border:1px dashed var(--line-strong);border-radius:10px"><h3>No orders found</h3><p>Nothing matches these filters.</p>${btn("Clear filters")}</div>
    <div style="display:grid;gap:14px;padding:6px 0">${[70, 90, 55, 80].map((w) => `<div style="display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center"><div class="skel" style="height:44px;border-radius:8px"></div><div style="display:grid;gap:8px"><div class="skel" style="width:${w}%"></div><div class="skel" style="width:${w - 25}%"></div></div></div>`).join("")}</div></div></div></section>
  </div>`;

/* ===== router ===== */
const ORDER = [["login", "Sign in"], ["login-forgot", "Forgot password"], ["dashboard", "Dashboard"], ["users", "Users"], ["users-profile", "Customer profile"], ["orders", "Orders"], ["orders-unpaid", "Orders: unpaid"], ["orders-modal", "Update status"], ["notices", "Notices"], ["areas", "Delivery areas"], ["areas-delete", "Area in use"], ["sessions", "Sessions"], ["food", "Food items"], ["food-add", "Add item"], ["persons", "Delivery persons"], ["admins", "Admins"], ["admins-add", "Add admin"], ["reports", "Reports"], ["settings", "Settings"], ["audit", "Audit logs"], ["components", "Components"]];
const bare = /[?&]bare\b/.test(location.search);
document.body.classList.toggle("bare", bare);
function render() {
  const id = location.hash.slice(1) || "orders";
  const fn = S[id] || S.orders;
  document.getElementById("root").innerHTML = fn();
  document.getElementById("picker").innerHTML = "<b>Admin Panel mockups</b>" + ORDER.map(([k, n]) => `<a href="#${k}" class="${k === id ? "on" : ""}">${n}</a>`).join("");
  document.title = "Mockup: " + id;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
<style>.m-only{display:none}@media (max-width:640px){.m-only{display:block}}</style>
</body>
</html>
